<body class="h-[2000vh]">

    <header class="w-full flex justify-center absolute top-0">

            <section class=" justify-between md:w-90/100 xl:w-75/100 *:flex *:items-center">

                </div>

                <a class="justify-end" href="">
                    <figure class="h-10 md:hidden">

                    <figure class="hidden md:block h-10">

            </section>

            <!--==================#1-2 LOGIN HTML ==================-->

            <video autoplay muted loop class="w-full h-full object-cover" src="assets/Images/Hero.mp4"></video>



            <div class="w-80/100 flex flex-wrap gap-2.5 lg:gap-10 *:text-white absolute bottom-10/100 left-50/100 -translate-x-1/2 2xl:pl-20 2xl:container">

                <div class="w-full">
                    <a class="w-full flex items-center justify-center text-center capitalize bg-[#494d4fa8] px-6 py-3.5 rounded-lg md:w-fit hover:bg-[#0000003f] duration-300" href="">discover more</a>

            </div>
